services:
  # Servicio de Persistencia y Checkpointing
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis_agente
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Servicio de Observabilidad Arize Phoenix
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix_agente
    ports:
      - "6006:6006"

  # Servicio de la API FastAPI
  web:
    build: .
    container_name: api_agente
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./screenshots:/app/screenshots
      - ./chroma_db:/app/chroma_db

volumes:
  redis_data: